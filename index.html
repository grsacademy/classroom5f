<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롯데지알에스 아카데미 5층 안내</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --lotte-red: #E60012;
            --bg-light: #F4F5F7;
            --text-main: #111111;
            --text-sub: #666666;
            --card-shadow: 0 12px 35px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }

        body {
            background-color: #1A1A1A;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 전체 컨테이너: 16:9 비율 유지 */
        #dashboard {
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 120px rgba(0,0,0,0.7);
            position: relative;
        }

        /* --- 상단 헤더 영역 --- */
        header {
            background-color: white;
            height: 110px;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #E5E5E5;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .logo-img {
            height: 32px;
            width: auto;
        }

        .clock-area {
            text-align: right;
        }

        #current-date {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 3px;
        }

        #current-time {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -1.5px;
            line-height: 1;
        }

        /* --- 서브 헤더 (층수 안내) --- */
        .sub-header {
            padding: 40px 60px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .guide-box h2 {
            font-size: 2.2rem;
            color: var(--lotte-red);
            font-weight: 800;
        }

        .guide-box p {
            font-size: 1.25rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 12px;
            letter-spacing: -0.3px;
        }
        
        .guide-box p strong {
            color: var(--text-main);
            background: #FFF0F1;
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* --- 메인 콘텐츠 (강의장 카드 그리드 - 최대 5개 반응형 확장) --- */
        .main-content {
            flex: 1;
            padding: 20px 60px 40px;
            display: grid;
            gap: 25px;
            align-content: center;
            /* 최대 5개까지 유연하게 배치되는 반응형 레이아웃 (5F 전용) */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .course-card {
            background: white;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            min-height: 380px;
            box-shadow: var(--card-shadow);
            border-top: 8px solid var(--lotte-red);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card-top {
            padding: 35px 35px 20px;
        }

        .course-card .title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.4;
            word-break: keep-all;
            margin-bottom: 30px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #F8F9FA;
            padding: 20px;
            border-radius: 18px;
            border: 1px solid #EBECEF;
        }

        .info-row {
            display: flex;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .info-label {
            width: 80px;
            color: var(--text-sub);
            flex-shrink: 0;
            font-weight: 500;
        }

        .card-bottom {
            background: #FAFAFA;
            border-top: 1px solid #EEE;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-info span {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .room-info p {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--lotte-red);
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .direction-arrow {
            width: 55px; height: 55px;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            flex-shrink: 0;
            border: 1px solid #EAEAEA;
        }

        .direction-arrow svg {
            width: 26px; height: 26px;
            fill: var(--text-main);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.6rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* --- 하단 푸터 --- */
        footer {
            background-color: #FFFFFF;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border-top: 1px solid #E5E5E5;
        }

        .contact-capsule {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 25px;
            border-radius: 30px;
        }

        .contact-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--lotte-red);
            letter-spacing: 1.5px;
        }

        .contact-divider {
            width: 1px;
            height: 14px;
            background-color: #D1D1D1;
        }

        .contact-number {
            font-size: 1.05rem;
            font-weight: 800;
            color: #111;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="dashboard">
    <header>
        <div class="logo-area">
            <img src="logo.png" alt="LOTTE GRS" class="logo-img">
        </div>
        <div class="clock-area">
            <div id="current-date">0000. 00. 00 (요일)</div>
            <div id="current-time">00:00</div>
        </div>
    </header>

    <div class="sub-header">
        <div class="guide-box">
            <h2>5층 강의장 안내</h2>
            <p>현재 5층에서 진행 중인 교육 과정을 확인하실 수 있습니다. <strong>오늘 진행되는 교육만 표시</strong>됩니다.</p>
        </div>
    </div>

    <main class="main-content" id="courseContainer">
        <div class="loading-text">5층 교육 일정을 동기화 중입니다...</div>
    </main>

    <footer>
        <div class="contact-capsule">
            <span class="contact-label">INFORMATION</span>
            <span class="contact-divider"></span>
            <span class="contact-number">02-709-6920</span>
        </div>
    </footer>
</div>

<script>
    // ★ 연동할 구글 통합 스프레드시트 ID 입력 (관리자 앱과 동일한 ID)
    const SHEET_ID = '1T6gk3ediGcWimaS5EXVVxHnoqrW2aOdZJ5fGZVYVgLg';

    // 화살표 방향 매핑 딕셔너리
    const arrowMap = {
        'up': `<svg viewBox="0 0 24 24"><path d="M12 2l-8 8h6v12h4v-12h6z"/></svg>`,
        'down': `<svg viewBox="0 0 24 24"><path d="M12 22l8-8h-6v-12h-4v12h-6z"/></svg>`,
        'left': `<svg viewBox="0 0 24 24"><path d="M2 12l8-8v6h12v4h-12v6z"/></svg>`,
        'right': `<svg viewBox="0 0 24 24"><path d="M22 12l-8 8v-6h-12v-4h12v-6z"/></svg>`
    };

    // 시계 동기화 함수
    function updateClock() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const week = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');

        document.getElementById('current-date').innerText = `${y}. ${m}. ${d} (${week})`;
        document.getElementById('current-time').innerText = `${hh}:${mm}`;
    }

    // Gviz 날짜 데이터를 YYYY-MM-DD 형식의 문자열로 안전하게 변환
    function parseGvizDate(cell) {
        if (!cell) return '';
        if (cell.f) {
            return String(cell.f).replace(/\./g, '-').replace(/\s/g, '').substring(0, 10);
        }
        if (cell.v) {
            const val = String(cell.v);
            if (val.startsWith('Date(')) {
                const match = val.match(/Date\((\d+),(\d+),(\d+)/);
                if (match) {
                    const y = match[1];
                    const m = String(parseInt(match[2]) + 1).padStart(2, '0');
                    const d = String(match[3]).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }
            }
            return val.substring(0, 10);
        }
        return '';
    }

    // 구글 시트 데이터 로드 및 5층 필터링 함수
    async function fetchSheetData() {
        try {
            const targetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=교육일정`;
            const response = await fetch(targetUrl);
            const text = await response.text();
            
            const jsonStr = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/)[1];
            const data = JSON.parse(jsonStr);
            const rows = data.table.rows;

            // 조회 기준일(오늘 날짜) 생성 YYYY-MM-DD
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const todayStr = `${y}-${m}-${d}`;

            let fiveFloorCourses = [];

            if (rows) {
                rows.forEach(row => {
                    if (!row || !row.c) return;
                    
                    // B(1): 과정명, C(2): 시작일, D(3): 종료일, E(4): 시간, F(5): 방향, G(6): 층, H(7): 강의장, K(10): 상태
                    const title = row.c[1] ? (row.c[1].v || row.c[1].f) : '';
                    const startDate = parseGvizDate(row.c[2]);
                    const endDate = parseGvizDate(row.c[3]);
                    const periodText = (startDate && endDate) ? `${startDate} ~ ${endDate}` : '';
                    const time = row.c[4] ? (row.c[4].v || row.c[4].f) : '';
                    const direction = row.c[5] ? (row.c[5].v || row.c[5].f) : 'right';
                    const floorVal = row.c[6] ? (row.c[6].v || row.c[6].f) : '';
                    const room = row.c[7] ? (row.c[7].v || row.c[7].f) : '';
                    const status = row.c[10] ? (row.c[10].v || row.c[10].f) : '';

                    // ★ 5층(5F 또는 5층) 조건 및 오늘 날짜 포함 여부, 예약 상태 확인
                    const is5Floor = String(floorVal).includes('5');
                    const isTodayActive = (startDate <= todayStr && todayStr <= endDate);

                    if (status === '예약' && is5Floor && isTodayActive) {
                        fiveFloorCourses.push({
                            title: String(title),
                            period: periodText,
                            time: String(time),
                            room: String(room),
                            direction: String(direction).toLowerCase()
                        });
                    }
                });
            }

            renderCourses(fiveFloorCourses);

        } catch (error) {
            console.error('데이터 로드 실패:', error);
            document.getElementById('courseContainer').innerHTML = `<div class="loading-text" style="color:var(--lotte-red);">데이터를 불러오지 못했습니다. 관리자 설정을 확인하세요.</div>`;
        }
    }

    // 카드 렌더링 함수
    function renderCourses(courses) {
        const container = document.getElementById('courseContainer');
        
        if (courses.length === 0) {
            container.innerHTML = `<div class="loading-text">현재 5층에서 진행 중인 교육 과정이 없습니다.</div>`;
            return;
        }

        // 최대 5개까지 유연하게 표시되는 구조 렌더링
        container.innerHTML = courses.map((course, index) => `
            <div class="course-card" style="animation-delay: ${index * 0.08}s">
                <div class="card-top">
                    <h2 class="title">${course.title}</h2>
                    <div class="info-group">
                        <div class="info-row">
                            <span class="info-label">교육 일정</span>
                            <span>${course.period || '-'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">교육 시간</span>
                            <span>${course.time || '-'}</span>
                        </div>
                    </div>
                </div>
                <div class="card-bottom">
                    <div class="room-info">
                        <span>LECTURE ROOM</span>
                        <p>${course.room || '-'}</p>
                    </div>
                    <div class="direction-arrow">${arrowMap[course.direction] || arrowMap['right']}</div>
                </div>
            </div>
        `).join('');
    }

    // 주기적 실행 및 초기화
    updateClock();
    setInterval(updateClock, 1000);
    
    fetchSheetData();
    setInterval(fetchSheetData, 60000); // 1분 단위로 구글 시트 동기화
</script>

</body>
</html>
